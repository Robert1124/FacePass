name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-release:
    name: Build, sign, notarize, and publish macOS release
    runs-on: macos-15-intel
    env:
      RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
      FACEPASS_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.FACEPASS_SPARKLE_PUBLIC_ED_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_PRIVATE_KEY_BASE64 }}
      SPARKLE_PRIVATE_ED_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_ED_KEY_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            FACEPASS_SPARKLE_PUBLIC_ED_KEY \
            APPLE_TEAM_ID \
            DEVELOPER_ID_APPLICATION \
            DEVELOPER_ID_CERTIFICATE_BASE64 \
            DEVELOPER_ID_CERTIFICATE_PASSWORD \
            NOTARY_KEY_ID \
            NOTARY_ISSUER_ID \
            NOTARY_PRIVATE_KEY_BASE64 \
            SPARKLE_PRIVATE_ED_KEY_BASE64
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'Missing required release secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/facepass-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          base64 --decode <<< "$DEVELOPER_ID_CERTIFICATE_BASE64" > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Prepare notarization key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/notary"
          base64 --decode <<< "$NOTARY_PRIVATE_KEY_BASE64" > "$RUNNER_TEMP/notary/AuthKey_${NOTARY_KEY_ID}.p8"

      - name: Resolve dependencies
        run: swift package resolve

      - name: Run tests
        run: swift test

      - name: Set up legacy model conversion Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Prepare bundled recognition model artifact
        shell: bash
        env:
          FACEPASS_PHASE8_LEGACY_PYTHON: python3.8
        run: |
          set -euo pipefail
          if script/phase8_auraface_artifact.sh verify-bundled; then
            echo "Bundled recognition model artifact already verified."
          else
            script/phase8_auraface_artifact.sh prepare-bundled
          fi

      - name: Build release app bundle
        shell: bash
        run: |
          set -euo pipefail
          export FACEPASS_APP_VERSION="${RELEASE_VERSION#v}"
          export FACEPASS_BUNDLE_VERSION="${GITHUB_RUN_NUMBER}"
          script/build_and_run.sh --release

      - name: Developer ID sign app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/FacePass.app"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          codesign --force --timestamp --options runtime --sign "$DEVELOPER_ID_APPLICATION" "$SPARKLE/Versions/B/XPCServices/Installer.xpc"
          codesign --force --timestamp --options runtime --preserve-metadata=entitlements --sign "$DEVELOPER_ID_APPLICATION" "$SPARKLE/Versions/B/XPCServices/Downloader.xpc"
          codesign --force --timestamp --options runtime --sign "$DEVELOPER_ID_APPLICATION" "$SPARKLE/Versions/B/Autoupdate"
          codesign --force --timestamp --options runtime --sign "$DEVELOPER_ID_APPLICATION" "$SPARKLE/Versions/B/Updater.app"
          codesign --force --timestamp --options runtime --sign "$DEVELOPER_ID_APPLICATION" "$SPARKLE"
          codesign --force --timestamp --options runtime --sign "$DEVELOPER_ID_APPLICATION" "$APP"
          codesign --verify --strict --deep "$APP"

      - name: Submit app bundle for notarization
        shell: bash
        run: |
          set -euo pipefail
          APP_NOTARY_ZIP="$RUNNER_TEMP/FacePass-${RELEASE_VERSION#v}-app-notary.zip"
          APP_NOTARY_OUTPUT="$RUNNER_TEMP/app-notary-submit.json"
          rm -f "$APP_NOTARY_ZIP"
          /usr/bin/ditto -c -k --keepParent --sequesterRsrc --zlibCompressionLevel 9 "dist/FacePass.app" "$APP_NOTARY_ZIP"
          set +e
          xcrun notarytool submit "$APP_NOTARY_ZIP" \
            --key "$RUNNER_TEMP/notary/AuthKey_${NOTARY_KEY_ID}.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee "$APP_NOTARY_OUTPUT"
          submit_status="${PIPESTATUS[0]}"
          set -e
          submission_id="$(ruby -rjson -e 'data = JSON.parse(File.read(ARGV[0])); print(data["id"].to_s)' "$APP_NOTARY_OUTPUT")"
          notary_status="$(ruby -rjson -e 'data = JSON.parse(File.read(ARGV[0])); print(data["status"].to_s)' "$APP_NOTARY_OUTPUT")"
          if [[ "$submit_status" != "0" || "$notary_status" != "Accepted" ]]; then
            echo "App notarization failed with status: ${notary_status:-unknown}" >&2
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" \
                --key "$RUNNER_TEMP/notary/AuthKey_${NOTARY_KEY_ID}.p8" \
                --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER_ID" \
                --team-id "$APPLE_TEAM_ID" || true
            fi
            exit 1
          fi

      - name: Staple notarized app
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if xcrun stapler staple "dist/FacePass.app"; then
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "Failed to staple app after $attempt attempts." >&2
              exit 1
            fi
            echo "App notarization ticket is not available yet; retrying in 20 seconds."
            sleep 20
          done
          xcrun stapler validate "dist/FacePass.app"
          spctl --assess --type execute --verbose=4 "dist/FacePass.app"

      - name: Package release DMG
        shell: bash
        run: |
          set -euo pipefail
          export FACEPASS_APP_VERSION="${RELEASE_VERSION#v}"
          script/package_release.sh

      - name: Developer ID sign DMG
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="dist/release/FacePass-${RELEASE_VERSION#v}.dmg"
          codesign --force --timestamp --sign "$DEVELOPER_ID_APPLICATION" "$PACKAGE"
          codesign --verify --verbose=4 "$PACKAGE"

      - name: Submit DMG for notarization
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="dist/release/FacePass-${RELEASE_VERSION#v}.dmg"
          DMG_NOTARY_OUTPUT="$RUNNER_TEMP/dmg-notary-submit.json"
          set +e
          xcrun notarytool submit "$PACKAGE" \
            --key "$RUNNER_TEMP/notary/AuthKey_${NOTARY_KEY_ID}.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee "$DMG_NOTARY_OUTPUT"
          submit_status="${PIPESTATUS[0]}"
          set -e
          submission_id="$(ruby -rjson -e 'data = JSON.parse(File.read(ARGV[0])); print(data["id"].to_s)' "$DMG_NOTARY_OUTPUT")"
          notary_status="$(ruby -rjson -e 'data = JSON.parse(File.read(ARGV[0])); print(data["status"].to_s)' "$DMG_NOTARY_OUTPUT")"
          if [[ "$submit_status" != "0" || "$notary_status" != "Accepted" ]]; then
            echo "DMG notarization failed with status: ${notary_status:-unknown}" >&2
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" \
                --key "$RUNNER_TEMP/notary/AuthKey_${NOTARY_KEY_ID}.p8" \
                --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER_ID" \
                --team-id "$APPLE_TEAM_ID" || true
            fi
            exit 1
          fi

      - name: Staple notarized DMG and refresh checksum
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="dist/release/FacePass-${RELEASE_VERSION#v}.dmg"
          for attempt in {1..6}; do
            if xcrun stapler staple "$PACKAGE"; then
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "Failed to staple DMG after $attempt attempts." >&2
              exit 1
            fi
            echo "DMG notarization ticket is not available yet; retrying in 20 seconds."
            sleep 20
          done
          xcrun stapler validate "$PACKAGE"
          hdiutil verify "$PACKAGE"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$PACKAGE"
          shasum -a 256 "$PACKAGE" > "$PACKAGE.sha256"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE="dist/release/FacePass-${RELEASE_VERSION#v}.dmg"
          gh release view "$RELEASE_VERSION" >/dev/null 2>&1 || \
            gh release create "$RELEASE_VERSION" --draft --title "$RELEASE_VERSION" --notes "FacePass $RELEASE_VERSION"
          gh release upload "$RELEASE_VERSION" "$PACKAGE" "$PACKAGE.sha256" --clobber

      - name: Generate Sparkle appcast draft
        shell: bash
        run: |
          set -euo pipefail
          SPARKLE_PRIVATE_KEY="$RUNNER_TEMP/sparkle_ed_private_key"
          base64 --decode <<< "$SPARKLE_PRIVATE_ED_KEY_BASE64" > "$SPARKLE_PRIVATE_KEY"
          chmod 600 "$SPARKLE_PRIVATE_KEY"
          APPCAST_INPUT="$RUNNER_TEMP/appcast-input"
          mkdir -p "$APPCAST_INPUT" website/updates
          cp "dist/release/FacePass-${RELEASE_VERSION#v}.dmg" "$APPCAST_INPUT/"
          GENERATE_APPCAST="$(find .build -name generate_appcast -type f -perm -111 -print -quit)"
          if [[ -z "$GENERATE_APPCAST" ]]; then
            echo "Sparkle generate_appcast tool was not found in SwiftPM artifacts" >&2
            exit 1
          fi
          "$GENERATE_APPCAST" \
            --ed-key-file "$SPARKLE_PRIVATE_KEY" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_VERSION}" \
            "$APPCAST_INPUT"
          cp "$APPCAST_INPUT/appcast.xml" website/updates/appcast.xml

      - name: Verify Sparkle release gate
        shell: bash
        run: |
          set -euo pipefail
          script/verify_sparkle_release.sh \
            --app dist/FacePass.app \
            --strict \
            --release-package "dist/release/FacePass-${RELEASE_VERSION#v}.dmg"

      - name: Publish appcast to website source
        shell: bash
        run: |
          set -euo pipefail
          GENERATED_APPCAST="$RUNNER_TEMP/generated-appcast.xml"
          cp website/updates/appcast.xml "$GENERATED_APPCAST"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "refs/remotes/origin/$DEFAULT_BRANCH"
          mkdir -p website/updates
          cp "$GENERATED_APPCAST" website/updates/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/updates/appcast.xml
          if git diff --cached --quiet; then
            echo "website/updates/appcast.xml is already current."
          else
            git commit -m "chore: update Sparkle appcast for ${RELEASE_VERSION}"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

      - name: Upload appcast artifact for website publication
        uses: actions/upload-artifact@v4
        with:
          name: appcast-${{ env.RELEASE_VERSION }}
          path: website/updates/appcast.xml
